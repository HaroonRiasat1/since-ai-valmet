<svg xmlns="http://www.w3.org/2000/svg" width="640" height="166" viewBox="0 0 640 166" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="0" y="22" font-size="17" font-weight="600" fill="#57606a">Assets a walker can reach, by body size</text>
<text x="0" y="40" font-size="12" fill="#8b949e">assets with a route on the 60 × 60 grid, from the default start</text>
<line x1="210" y1="48" x2="210" y2="136" stroke="#d0d7de" stroke-width="1"/>
<line x1="300" y1="48" x2="300" y2="136" stroke="#d0d7de" stroke-width="1"/>
<line x1="390" y1="48" x2="390" y2="136" stroke="#d0d7de" stroke-width="1"/>
<line x1="480" y1="48" x2="480" y2="136" stroke="#d0d7de" stroke-width="1"/>
<line x1="570" y1="48" x2="570" y2="136" stroke="#d0d7de" stroke-width="1"/>
<text x="200" y="70" font-size="13" text-anchor="end" fill="#57606a">1 cell (0.15 m)</text>
<rect x="210" y="52" width="315.0" height="26" rx="4" fill="#d4a72c"/>
<text x="533.0" y="70" font-size="13" font-weight="600" fill="#57606a">35 / 40</text>
<text x="200" y="110" font-size="13" text-anchor="end" fill="#57606a">3 cells (0.45 m, default)</text>
<rect x="210" y="92" width="270.0" height="26" rx="4" fill="#2da44e"/>
<text x="488.0" y="110" font-size="13" font-weight="600" fill="#57606a">30 / 40</text>
<text x="0" y="158" font-size="11" fill="#8b949e">A person-sized walker no longer squeezes through 15 cm gaps; the rest get a clear 'too narrow' reason.</text>
</svg>