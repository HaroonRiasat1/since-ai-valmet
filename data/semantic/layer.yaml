- name: knowledge_doc
  source: Knowledge_Docs
  label: Knowledge documents
  kind: reference
  grain: one document
  description: Diagnostic guidance per class, plus the safety, evidence and mapping
    contracts.
  synonyms:
  - document
  - guidance
  - manual
  - procedure
  - safety
  - policy
  columns:
  - name: doc_id
    label: Doc id
    role: key
    type: text
    values:
    - DOC-3D-MAPPING
    - DOC-CONTROL_VALVE-CORE
    - DOC-ELECTRIC_MOTOR-CORE
    - DOC-FIELD-SAFETY
    - DOC-PRESSURE_TRANSMITTER-CORE
    - DOC-PROCESS_PUMP-CORE
    - DOC-RAG-GUIDE
    - DOC-VIBRATION_SENSOR-CORE
  - name: title
    label: Title
    role: attribute
    type: text
    values:
    - 3D scene-to-asset mapping contract
    - Control valve diagnostic context
    - Electric motor condition context
    - Evidence-grounded AI response contract
    - Field-service safety guardrail
    - Pressure transmitter validation
    - Process pump condition context
    - Vibration sensor quality context
  - name: scope
    label: Scope
    role: attribute
    type: text
    values:
    - ALL
    - CONTROL_VALVE
    - ELECTRIC_MOTOR
    - PRESSURE_TRANSMITTER
    - PROCESS_PUMP
    - VIBRATION_SENSOR
  - name: content
    label: Content
    role: attribute
    type: text
    values:
    - Assess continuity, drift, signal quality and comparison against process context
      or a reference measurement.
    - Assess signal stability, drift, missing data and mounting quality. Poor sensor
      quality should reduce downstream confidence.
    - Map visible objects to stable asset IDs with explicit confidence. Mapping may
      use scene hierarchy, annotation, QR/NFC or computer vision. Never silently guess
      identity.
    - Name the asset, cite telemetry/events/doc IDs, state confidence, distinguish
      observation from hypothesis, and propose the next safe verification step.
    - The assistant must not replace site procedures, lockout/tagout, permits, OEM
      instructions or qualified personnel. Recommend verification and escalation rather
      than autonomous physical action.
    - Use position, controller diagnostics, pneumatic condition, process context and
      service history together. Treat friction/stiction, position deviation, abnormal
      load, supply pressure and device alerts as investigation signals, not standalone
      proof.
    - Use vibration, bearing temperature, current/load and operating history. Prefer
      trend evidence over isolated thresholds.
    - Use vibration, bearing temperature, pressure, flow and motor load together.
      Look for consistent multivariate changes and verify locally before maintenance
      work.
