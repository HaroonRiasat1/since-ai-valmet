recipes:
- name: priority_list
  label: Maintenance priority list
  description: Assets that are not healthy, lowest health first.
  parameters: []
  spec:
    entity: asset_state
    dimensions:
    - tag
    - asset_class
    - area_name
    - criticality
    - health_score
    - condition_state
    - issue_summary
    - urgency
    filters:
    - field: condition_state
      op: '!='
      value: healthy
    order_by:
    - field: health_score
      dir: asc
- name: open_high_alerts
  label: Open high-severity alerts
  description: Open high-severity events per asset, most first.
  parameters: []
  spec:
    entity: event
    measures:
    - count
    dimensions:
    - tag
    - area_name
    filters:
    - field: status
      op: '='
      value: open
    - field: severity
      op: '='
      value: high
    order_by:
    - field: count
      dir: desc
- name: repeat_work
  label: Work that needed follow-up
  description: Work orders that did not close the issue, per asset, most first.
  parameters: []
  spec:
    entity: work_order
    measures:
    - count
    - downtime_h
    dimensions:
    - tag
    filters:
    - field: result
      op: '='
      value: follow_up_required
    order_by:
    - field: count
      dir: desc
- name: asset_trend
  label: Daily signal trend of one asset
  description: Readings of one asset averaged per day.
  parameters:
  - name: tag
    type: string
    required: true
  spec:
    entity: telemetry
    measures:
    - column: process_pressure_bar
      agg: avg
    - column: process_flow_pct
      agg: avg
    - column: vibration_mm_s
      agg: max
    - column: bearing_temp_c
      agg: max
    - column: motor_current_a
      agg: avg
    dimensions:
    - day
    filters:
    - field: tag
      op: '='
      value: '{tag}'
    order_by:
    - field: day
      dir: asc
- name: health_by_class
  label: Health by asset class
  description: Assets, average health and assets under 70 per class.
  parameters: []
  spec:
    entity: asset_state
    measures:
    - count
    - health_score
    dimensions:
    - asset_class
    order_by:
    - field: asset_class
      dir: asc
glossary:
- term: CV
  meaning: Control valve. Tag prefix CV-.
- term: P
  meaning: Process pump. Tag prefix P-.
- term: M
  meaning: Electric motor. Tag prefix M-.
- term: PT
  meaning: Pressure transmitter. Tag prefix PT-.
- term: VS
  meaning: Vibration sensor. Tag prefix VS-.
- term: Stiction
  meaning: Static friction that stops a valve moving smoothly.
- term: Cavitation
  meaning: Vapour bubbles collapsing in a pump, which damages it.
- term: Lockout-tagout
  meaning: Isolating equipment before work. Always follow the site procedure.
- term: Fault target
  meaning: The asset the demo walks to, CV-003 by default.
